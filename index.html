<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>deelion links</title>

    <link
      rel="icon"
      type="image/x-icon"
      href="/assets/img/deelion-favicon.png"
    />
    <link href="/assets/css/style.css" , rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <div class="profile-pic">
          <img src="/assets/img/deelion.jpg" />
        </div>
        <div class="name"><h1>deelion</h1></div>
        <div class="bio">
          I like to support and build resources that inch us closer to a future
          of co-operation, mutual care and community wellbeing.
        </div>
      </div>
      <div class="social-links">
        <div id="mastodon" class="social-link">
          <a href="https://mastodon.social/@deelion">
            <i class="fa-brands fa-mastodon"></i>
          </a>
        </div>
        <div id="github" class="social-link">
          <a href="https://github.com/deelion">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
      <h4>LINKS</h4>
      <div class="page-links">
        <form
          action="https://github.com/deelion/goodneighbours"
          class="form-link"
        >
          <input type="submit" value="goodneighbours" />
        </form>
        <form action="https://slrpnk.co.uk" class="form-link">
          <input type="submit" value="SLRPNK.co.uk" />
        </form>
        <form action="https://liberapay.com/deelion/" class="form-link">
          <input type="submit" value="Support my work" />
        </form>
      </div>
      <div class="footer"></div>
    </div>
  </body>
</html>
